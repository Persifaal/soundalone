syntax = "proto3";

option csharp_namespace = "SoundAlone.Contracts.Auth.V1";

package soundalone.auth.v1;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc Resend (VerifyEmailRequest) returns (VerifyEmailResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  string phone_number = 4;
  string user_agent = 5;
  string ip_address = 6;
}

message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at_unix = 3;
  string user_id = 4;
  string username = 5;
  string email = 6;
  bool is_email_verified = 7;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string ip_address = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at_unix = 3;
  string user_id = 4;
  string username = 5;
  string email = 6;
  bool is_email_verified = 7;
}

message RefreshRequest {
  string refresh_token = 1;
  string user_agent = 2;
  string ip_address = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message VerifyEmailRequest {
  string user_id = 1;
  string email = 2;
  string confirmation_code = 3;
}

message VerifyEmailResponse {
  bool success = 1;
}
syntax = "proto3";

option csharp_namespace = "SoundAlone.Contracts.Auth.V1";

package soundalone.auth.v1;

import "google/api/annotations.proto";

service AuthService {
  rpc Register (RegisterRequest) 
      returns (RegisterResponse){
    option (google.api.http) = {
      post: "/api/auth/register"
      body: "*"
    };
  };
  
  rpc Login (LoginRequest) 
      returns (LoginResponse){
    option (google.api.http) = {
      post: "/api/auth/login"
      body: "*"
    };
  };
  
  rpc Refresh (RefreshRequest) 
      returns (LoginResponse){
    option (google.api.http) = {
      post: "/api/auth/refresh"
      body: "*"
    };
  };
  
  rpc Logout (LogoutRequest) 
      returns (LogoutResponse){
    option (google.api.http) = {
      post: "/api/auth/logout"
      body: "*"
    };
  };
  
  rpc Resend (EmailRequest)
      returns (EmailResponse){
    option (google.api.http) = {
      post: "/api/auth/resend"
      body: "*"
    };
  };
  
  rpc ConfirmEmail(ConfirmEmailRequest) 
      returns (ConfirmEmailResponse){
    option (google.api.http) = {
      post: "/api/auth/confirm"
      body: "*"
    };
  };
  
  rpc Me(MeRequest)
      returns(MeResponse){
    option(google.api.http) = {
      get: "/api/auth/me"
    };
  };
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  string phone_number = 4;
  string user_agent = 5;
  string ip_address = 6;
}

message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at_unix = 3;
  string user_id = 4;
  string username = 5;
  string email = 6;
  bool is_email_verified = 7;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string ip_address = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_token_expires_at_unix = 3;
  string user_id = 4;
  string username = 5;
  string email = 6;
  bool is_email_verified = 7;
}

message RefreshRequest {
  string refresh_token = 1;
  string user_agent = 2;
  string ip_address = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message EmailRequest {
  string user_id = 1;
  string email = 2;
}

message EmailResponse {
  bool success = 1;
}

message ConfirmEmailRequest{
	string email =1;
	string code = 2;
}

message ConfirmEmailResponse{
	bool succes = 1;
}

message MeRequest{}

message MeResponse{
  string UserId = 1;
}
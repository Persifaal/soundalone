services:
  # ================= INFRASTRUCTURE =================

  postgres:
    image: postgres:16-alpine
    container_name: soundalone-postgres
    profiles: ["infra"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soundalone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundalone_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-soundalone_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soundalone_user} -d ${POSTGRES_DB:-soundalone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soundalone-network

  redis:
    image: redis:7-alpine
    container_name: soundalone-redis
    profiles: ["infra"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soundalone-network

  mailpit:
      image: axllent/mailpit:latest
      ports:
        - "1025:1025"
        - "8025:8025"
      networks:
        - soundalone-network
      environment:
        - MP_SMTP_AUTH_ACCEPT_ANY=1 
        - MP_SMTP_AUTH_ALLOW_INSECURE=1

  minio:
    image: minio/minio:latest
    container_name: soundalone-minio
    profiles: ["infra"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - soundalone-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: soundalone-zookeeper
    profiles: ["infra"]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - soundalone-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: soundalone-kafka
    profiles: ["infra"]
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - soundalone-network

  grafana:
    image: grafana/grafana:latest
    container_name: soundalone-grafana
    profiles: ["infra"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - soundalone-network

  # ================= API SERVICES =================

  apigateway:
      build:
        context: ../src/ApiGateway
        dockerfile: ApiGateway.Api/Dockerfile
      container_name: soundalone-apigateway
      profiles: ["apps"]
      environment:
        ASPNETCORE_ENVIRONMENT: Development
      ports:
        - "${API_PORT:-8087}:8080"

      networks:
        - soundalone-network

  auth-service:
    build:
      context: ..
      dockerfile: src/AuthService/AuthService.Api/Dockerfile
    container_name: soundalone-auth
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-soundalone_db};Username=${POSTGRES_USER:-soundalone_user};Password=${POSTGRES_PASSWORD:-soundalone_secret_password}
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${AUTH_PORT:-8081}:8080"

    networks:
      - soundalone-network

  player-service:
    build:
      context: ..
      dockerfile: src/PlayerService/PlayerService.Api/Dockerfile
    container_name: soundalone-player
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-soundalone_db};Username=${POSTGRES_USER:-soundalone_user};Password=${POSTGRES_PASSWORD:-soundalone_secret_password}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${PLAYER_PORT:-8082}:8080"
    networks:
      - soundalone-network

  playlist-service:
    build:
      context: ..
      dockerfile: src/PlaylistService/PlaylistService.Api/Dockerfile
    container_name: soundalone-playlist
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-soundalone_db};Username=${POSTGRES_USER:-soundalone_user};Password=${POSTGRES_PASSWORD:-soundalone_secret_password}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${PLAYLIST_PORT:-8083}:8080"
    networks:
      - soundalone-network

  moderation-service:
    build:
      context: ..
      dockerfile: src/ModerationService/ModerationService.Api/Dockerfile
    container_name: soundalone-moderation
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-soundalone_db};Username=${POSTGRES_USER:-soundalone_user};Password=${POSTGRES_PASSWORD:-soundalone_secret_password}
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${MODERATION_PORT:-8084}:8080"
    networks:
      - soundalone-network

  notification-service:
    build:
      context: ..
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    container_name: soundalone-notification
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${NOTIFICATION_PORT:-8085}:8080"
    networks:
      - soundalone-network

  social-service:
    build:
      context: ..
      dockerfile: src/SocialService/SocialService.Api/Dockerfile
    container_name: soundalone-social
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-soundalone_db};Username=${POSTGRES_USER:-soundalone_user};Password=${POSTGRES_PASSWORD:-soundalone_secret_password}
      ConnectionStrings__Redis: redis:6379
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${SOCIAL_PORT:-8086}:8080"
    networks:
      - soundalone-network

  sender-service:
    build:
      context: ../src/SenderService
      dockerfile: SernderService.Api/Dockerfile
    container_name: soundalone-sender
    profiles: ["apps"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "${SENDER_PORT:-8088}:8080"

    networks:
      - soundalone-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  soundalone-network:
    driver: bridge

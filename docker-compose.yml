services:
  # ================= ИНФРАСТРУКТУРА =================

  postgres:
    image: postgres:16-alpine
    container_name: soundalone-postgres
    environment:
      POSTGRES_USER: soundalone_user
      POSTGRES_PASSWORD: soundalone_secret_password
      POSTGRES_DB: soundalone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundalone_user -d soundalone_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soundalone-network

  redis:
    image: redis:7-alpine
    container_name: soundalone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - soundalone-network

  minio:
    image: minio/minio:latest
    container_name: soundalone-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - soundalone-network

  zookeeper:
    container_name: soundalone-zookeeper
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - soundalone-network
  
  kafka:
    container_name: soundalone-kafka
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - soundalone-network

  prometheus:
    image: prom/prometheus:latest
    container_name: soundalone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - soundalone-network

  grafana:
    image: grafana/grafana:latest
    container_name: soundalone-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - soundalone-network

    # ================= МИКРОСЕРВИСЫ =================

  auth-service:
    build:
      context: .
      dockerfile: src/AuthService/AuthService.Api/Dockerfile

    container_name: soundalone-auth
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=soundalone_db;Username=soundalone_user;Password=soundalone_secret_password
      - ConnectionStrings__Redis=redis:6379
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - soundalone-network

  player-service:
    build:
      context: .
      dockerfile: src/PlayerService/PlayerService.Api/Dockerfile # Проверьте точный путь
    container_name: soundalone-player
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=soundalone_db;Username=soundalone_user;Password=soundalone_secret_password
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadmin123
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - soundalone-network

  playlist-service:
    build:
      context: .
      dockerfile: src/PlaylistService/PlaylistService.Api/Dockerfile # Проверьте точный путь
    container_name: soundalone-playlist
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=soundalone_db;Username=soundalone_user;Password=soundalone_secret_password
      - ConnectionStrings__Redis=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - soundalone-network

  moderation-service:
    build:
      context: .
      dockerfile: src/ModerationService/ModerationService.Api/Dockerfile # Проверьте точный путь
    container_name: soundalone-moderation
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=soundalone_db;Username=soundalone_user;Password=soundalone_secret_password
      - Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - soundalone-network

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    container_name: soundalone-notification
    environment:
      - ConnectionStrings__Redis=redis:6379
      - Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - soundalone-network

  social-service:
    build:
      context: .
      dockerfile: src/SocialService/SocialService.Api/Dockerfile # Проверьте точный путь
    container_name: soundalone-social
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=soundalone_db;Username=soundalone_user;Password=soundalone_secret_password
      - ConnectionStrings__Redis=redis:6379
      - Kafka__BootstrapServers=kafka:9092
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - soundalone-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  soundalone-network:
    driver: bridge